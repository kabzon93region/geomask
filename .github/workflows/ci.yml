name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Build consistency (geomask.sh == build of geomask.sh.in + assets)
        run: python tools/check_build.py --verify-only

      - name: RPC manifest parity (four generated integration points)
        run: python tools/gen-geo-rpc.py --check

      - name: Syntax check (installer shell)
        run: sh -n geomask.sh

      - name: Syntax check (panel JavaScript)
        run: node --check assets/geo-sync-page.js

      - name: Compile every shipped python module
        run: python -m py_compile assets/geomask-node-audit.py assets/geomask-audit-state.py assets/geomask-config-tx.py assets/geomask-config-owner.py assets/geomask-apply.py assets/geomask-lane-torrent.py assets/geomask-sync-youtube.py assets/geomask-seed-lists.py tools/gen-geo-rpc.py tools/node-audit-save.py

      # One module per process with its own timeout and its own HOME/TMPDIR, via
      # tests/testgate.py. This gate records testsRun/passed/failed/skipped (with the reason
      # unittest reported), timeouts and rc per module; a module where every test was skipped
      # is NOT "ok", and an unknown skip reason fails the run. It is still not isolation:
      # tests/test_sandbox_guard.py is an after-the-fact detector for six modules, not a sandbox.
      - name: Unit tests
        env:
          PYTHONPATH: tests
        run: |
          python -B tests/testgate.py run --tests-dir tests --log-dir test-logs --timeout 600

      - name: Upload unit gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-gate-logs
          path: test-logs/
          if-no-files-found: warn

      - name: Sandbox tests
        env:
          GM_TEST_LOG_DIR: sandbox-logs
        run: timeout --kill-after=10 900 bash tests/run_tests.sh

      - name: Upload sandbox logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-logs
          path: sandbox-logs/
          if-no-files-found: warn
